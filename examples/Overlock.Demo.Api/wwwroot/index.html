<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlock - Collaborative Editing Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .content { padding: 30px; }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .status.connected { background: #d4edda; color: #155724; }
        .status.disconnected { background: #f8d7da; color: #721c24; }
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .editor-box {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
        }
        .editor-box h3 {
            margin-bottom: 10px;
            color: #667eea;
        }
        textarea, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 10px;
        }
        textarea {
            min-height: 200px;
            resize: vertical;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        .peers {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .peers h3 { margin-bottom: 10px; color: #333; }
        .peer {
            display: inline-block;
            padding: 8px 16px;
            background: white;
            border-radius: 20px;
            margin: 5px;
            border: 2px solid #667eea;
        }
        .data-preview {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Overlock</h1>
            <p>Conflict-free live collaboration</p>
        </div>
        <div class="content">
            <div id="status" class="status disconnected">Bağlanıyor...</div>

            <div class="editor-container">
                <div class="editor-box">
                    <h3>📝 Başlık</h3>
                    <input type="text" id="titleInput" placeholder="Başlık girin...">
                </div>
                <div class="editor-box">
                    <h3>👤 Kullanıcı Adı</h3>
                    <input type="text" id="clientId" placeholder="Adınız...">
                </div>
            </div>

            <div class="editor-box">
                <h3>📄 İçerik</h3>
                <textarea id="contentInput" placeholder="Buraya yazın... Değişiklikleriniz diğer kullanıcılarla otomatik senkronize edilecek."></textarea>
            </div>

            <button onclick="setField()">💾 Kaydet</button>

            <div class="peers">
                <h3>🌐 Aktif Kullanıcılar</h3>
                <div id="peersList"></div>
            </div>

            <div class="data-preview">
                <h3>🔍 Anlık Veri (CRDT State)</h3>
                <pre id="dataPreview">{}</pre>
            </div>
        </div>
    </div>

    <script>
        const DOCUMENT_ID = "demo-doc-1";
        let connection;
        let clientId = `user-${Math.random().toString(36).substr(2, 9)}`;
        let peers = new Set();

        // Initialize SignalR connection
        async function connect() {
            const serverUrl = window.location.origin.replace(/:\d+/, ':5001'); // Overlock.Server port
            connection = new signalR.HubConnectionBuilder()
                .withUrl(`${serverUrl}/collab`)
                .withAutomaticReconnect()
                .build();

            connection.on("DocumentState", (state) => {
                console.log("Received document state:", state);
                updateUI(state.data);
            });

            connection.on("OperationsReceived", (batch) => {
                console.log("Received operations:", batch);
                // Apply operations locally
                batch.operations.forEach(op => {
                    if (op.type === 'set') {
                        updateUIField(op.field, op.value);
                    }
                });
            });

            connection.on("ClientJoined", (peerId, presence) => {
                peers.add(peerId);
                updatePeersList();
                console.log("Client joined:", peerId);
            });

            connection.on("ClientLeft", (peerId) => {
                peers.delete(peerId);
                updatePeersList();
                console.log("Client left:", peerId);
            });

            try {
                await connection.start();
                document.getElementById("status").textContent = "✅ Bağlandı";
                document.getElementById("status").className = "status connected";
                document.getElementById("clientId").value = clientId;
                
                await connection.invoke("JoinDocument", DOCUMENT_ID, clientId, {
                    clientId: clientId,
                    userName: clientId,
                    metadata: {}
                });
            } catch (err) {
                console.error("Connection error:", err);
                document.getElementById("status").textContent = "❌ Bağlantı hatası";
                document.getElementById("status").className = "status disconnected";
            }
        }

        function updateUI(data) {
            if (data.title) document.getElementById("titleInput").value = data.title;
            if (data.content) document.getElementById("contentInput").value = data.content;
            document.getElementById("dataPreview").textContent = JSON.stringify(data, null, 2);
        }

        function updateUIField(field, value) {
            if (field === 'title') document.getElementById("titleInput").value = value || '';
            if (field === 'content') document.getElementById("contentInput").value = value || '';
            
            // Update preview
            const currentData = JSON.parse(document.getElementById("dataPreview").textContent || '{}');
            currentData[field] = value;
            document.getElementById("dataPreview").textContent = JSON.stringify(currentData, null, 2);
        }

        function updatePeersList() {
            const list = document.getElementById("peersList");
            if (peers.size === 0) {
                list.innerHTML = '<span style="opacity: 0.6;">Sadece siz</span>';
            } else {
                list.innerHTML = Array.from(peers).map(peer => 
                    `<span class="peer">${peer}</span>`
                ).join('');
            }
        }

        async function setField() {
            const title = document.getElementById("titleInput").value;
            const content = document.getElementById("contentInput").value;
            
            const operations = [
                {
                    type: "set",
                    counter: Date.now(),
                    clientId: clientId,
                    field: "title",
                    value: title
                },
                {
                    type: "set",
                    counter: Date.now() + 1,
                    clientId: clientId,
                    field: "content",
                    value: content
                }
            ];

            try {
                await connection.invoke("BroadcastOperations", {
                    documentId: DOCUMENT_ID,
                    operations: operations
                });
                console.log("Operations sent:", operations);
            } catch (err) {
                console.error("Send error:", err);
            }
        }

        // Auto-connect on load
        window.addEventListener('load', connect);

        // Auto-save on input (debounced)
        let saveTimeout;
        function autoSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(setField, 1000);
        }
        document.getElementById("titleInput").addEventListener('input', autoSave);
        document.getElementById("contentInput").addEventListener('input', autoSave);
    </script>
</body>
</html>
